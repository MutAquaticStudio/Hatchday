<div id="app">
  <div id="sky"></div>
  <canvas id="c" aria-label="Căn phòng 3D có thú cưng. Vuốt lên thú để vuốt ve, chạm để chọc."></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="dim"></div>
  <div id="wipe" aria-hidden="true"><span class="runner"></span><span id="wipe-label"></span></div>

  <header class="top">
    <div class="lcd" role="status" aria-live="polite"><span class="egg" aria-hidden="true"></span><span id="clock">--:--</span><span id="lcdmsg">Đang mở cửa…</span></div>
    <div class="top-btns"><button id="btn-coins" class="pill coins" type="button" title="Xu của bạn · mở cửa hàng"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffd36e" stroke="#a8742e" stroke-width="2"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.5h-3a1.8 1.8 0 0 0 0 3.5h4" fill="none" stroke="#a8742e" stroke-width="1.8" stroke-linecap="round"/></svg><span id="coin-n">0</span><span class="sr-only"> xu</span></button><button id="btn-diary" class="pill" type="button" aria-expanded="false" aria-controls="diary">Nhật ký</button><button id="btn-stats" class="pill" type="button" aria-expanded="false" aria-controls="stats">Chỉ số</button></div>
  </header>
  <div class="scene-tag" id="scene-tag">Phòng khách</div>

  <div class="hint" id="hint">Vuốt lên thú để vuốt ve · chạm để chọc</div>
  <div id="bubble" hidden></div>
  <div id="pops" aria-hidden="true"></div>
  <div id="toast" role="status" hidden></div>
  <div id="devhud" hidden></div>

  <section id="stats" class="sheet stats" hidden aria-label="Chỉ số của thú">
    <h2>Chỉ số</h2>
    <div id="species-card" class="species-card"></div>
    <label class="name">Tên riêng của thú<input id="pet-name" maxlength="16" autocomplete="off"></label>
    <div id="bars"></div>
    <div class="persona"><h3>Cá tính</h3><p id="persona-desc" class="note"></p><div id="persona-axes"></div></div>
    <div class="row quality" role="group" aria-label="Chất lượng hình ảnh">Hình ảnh <button type="button" class="qbtn" data-q="thap" aria-pressed="false">Thấp</button><button type="button" class="qbtn" data-q="vua" aria-pressed="true">Vừa</button><button type="button" class="qbtn" data-q="cao" aria-pressed="false">Cao</button></div>
    <div class="row sound" role="group" aria-label="Âm thanh">Âm thanh <button type="button" class="qbtn" id="snd-sfx" aria-pressed="true">Tiếng</button><button type="button" class="qbtn" id="snd-music" aria-pressed="true">Nhạc</button></div>
    <label class="row vol">Âm lượng<input type="range" id="snd-vol" min="0" max="100" step="5" value="70"></label>
    <label class="row" hidden><input type="checkbox" id="fast"> Tua nhanh thời gian ×60 (chế độ dev)</label>
    <p class="note">Chỉ số giảm theo giờ thật, kể cả khi bạn đóng trang. Mọi thứ được lưu vào tài khoản của bạn.</p>
    <button id="btn-tour" class="pill" type="button">Xem lại hướng dẫn</button>
    <button id="btn-logout" class="pill" type="button">Đăng xuất</button>
    <p hidden></p>
  </section>

  <section id="diary" class="sheet diary" hidden aria-label="Nhật ký của thú">
    <div class="tabs" role="tablist"><button class="tab" id="tab-pages" role="tab" type="button" aria-selected="true">Nhật ký</button><button class="tab" id="tab-mem" role="tab" type="button" aria-selected="false">Ký ức</button></div>
    <div class="dpanel" id="dpanel"></div>
  </section>

  <div class="bottom">
    <div class="review" hidden><span class="review-label">Duyệt biểu cảm</span><div class="chips" id="chips"></div></div>
    <div id="ctx" class="ctx" hidden></div>
    <div id="tray" class="tray" hidden></div>
    <form id="chat" class="chat" hidden autocomplete="off">
      <input id="chat-input" maxlength="120" placeholder="Nói gì đó với thú… (AI sẽ được nối sau)">
      <button type="submit">Gửi</button>
    </form>
    <nav class="bar" aria-label="Hành động">
      <button class="act" id="a-eat" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 15h18a9 9 0 0 1-18 0z" fill="#ffd36e" stroke="#4a2140" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10c0-2 2-2 2-4M17 10c0-2 2-2 2-4" fill="none" stroke="#ff8fb8" stroke-width="2.2" stroke-linecap="round"/></svg>Ăn</button>
      <button class="act" id="a-bath" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="17" r="7" fill="#bfe8ff" stroke="#4a2140" stroke-width="2.2"/><circle cx="22" cy="11" r="4.5" fill="#dff4ff" stroke="#4a2140" stroke-width="2.2"/><circle cx="22" cy="23" r="3" fill="#dff4ff" stroke="#4a2140" stroke-width="2"/><path d="M9 14a3 3 0 0 1 3-2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Tắm</button>
      <button class="act" id="a-play" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="#ff9ec4" stroke="#4a2140" stroke-width="2.2"/><path d="M6.5 13c6 3 13 3 19 0M8 21c5-2 11-2 16 0" fill="none" stroke="#fff" stroke-width="2.2"/></svg>Chơi</button>
      <button class="act" id="a-talk" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9a4 4 0 0 1 4-4h14a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-8l-6 5v-5H9a4 4 0 0 1-4-4z" fill="#fff3c4" stroke="#4a2140" stroke-width="2.2" stroke-linejoin="round"/><circle cx="11" cy="13.5" r="1.6" fill="#4a2140"/><circle cx="16" cy="13.5" r="1.6" fill="#4a2140"/><circle cx="21" cy="13.5" r="1.6" fill="#4a2140"/></svg>Nói</button>
      <button class="act" id="a-sleep" type="button" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21 5a11 11 0 1 0 6 17A9 9 0 0 1 21 5z" fill="#c9b8ff" stroke="#4a2140" stroke-width="2.2" stroke-linejoin="round"/></svg><span id="sleep-label">Ngủ</span></button>
      <button class="act" id="a-house" type="button" aria-pressed="false" title="Nhà: trang trí, cửa hàng, tủ đồ, nhiệm vụ (phím 6)"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15L16 6l11 9v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#ffd9a8" stroke="#4a2140" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 28v-7h6v7" fill="#ff9ec4" stroke="#4a2140" stroke-width="2.2" stroke-linejoin="round"/></svg>Nhà</button>
    </nav>
  </div>
</div>
