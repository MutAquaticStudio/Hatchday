<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Hatchday — Quản trị</title>
  <style>
    :root{--ink:#3b2a3a;--soft:#7a6a7a;--bg:#f7f3f8;--card:#fff;--edge:#e5d9ea;--accent:#d6457f;--ok:#2f8f5b;--warn:#b7791f;--bad:#c0392b}
    *{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--edge);position:sticky;top:0;z-index:5}
    header h1{font-size:16px;margin:0 8px 0 0}header .who{margin-left:auto;color:var(--soft);font-size:12px}
    nav{display:flex;flex-wrap:wrap;gap:6px}nav button{border:1px solid var(--edge);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer}
    nav button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
    main{max-width:1000px;margin:0 auto;padding:16px}
    h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 8px}
    .card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .stat{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:22px}.stat span{color:var(--soft);font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--edge);vertical-align:top}th{color:var(--soft);font-weight:600}
    label{display:block;margin:8px 0 2px;color:var(--soft);font-size:12px}input,select,textarea{width:100%;max-width:520px;padding:7px 9px;border:1px solid var(--edge);border-radius:8px;font:inherit;background:#fff}
    textarea{min-height:60px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row>*{flex:0 1 auto}
    button.p{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button.g{background:#fff;border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}.msg{margin:8px 0;padding:8px 10px;border-radius:8px;background:#eaf7ef;color:var(--ok)}.msg.err{background:#fdecea;color:var(--bad)}
    .pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:#eee}.pill.ok{background:#eaf7ef;color:var(--ok)}.pill.warn{background:#fff6e0;color:var(--warn)}.pill.bad{background:#fdecea;color:var(--bad)}
    .login{max-width:380px;margin:60px auto}.small{color:var(--soft);font-size:12px}
    /* Dashboard: màu phân loại theo thứ tự cố định (bộ màu đã kiểm bằng validate_palette), trục/lưới mờ, nét 2px */
    :root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--grid:#ece4f0;--axis:#7a6a7a}
    main:has(.kg){max-width:1180px}
    .dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.dctl button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
    .kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
    .kpi{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
    .kl{color:var(--soft);font-size:12px}.kv{font-size:24px;line-height:1.15}.ks{color:var(--soft);font-size:12px}.spark{width:100%;height:28px;margin-top:4px}
    .dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl{font-weight:600}
    .help{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:#eee;color:var(--soft);font-size:10px;cursor:help;font-weight:700}
    .cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}.cc{margin:0;overflow:visible;min-width:0}.cc.wide{grid-column:1/-1}.cc h4{margin:0 0 6px;font-size:13px}
    .chart{width:100%;height:auto;display:block;touch-action:pan-y}.chart .gl{stroke:var(--grid);stroke-width:1}.chart .ax{fill:var(--axis);font-size:12px}.chart .xh{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 3}.chart .hit{fill:transparent}
    .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--soft);margin-bottom:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
    .tv{margin-top:6px;font-size:12px}.tv summary{cursor:pointer;color:var(--soft)}.tvs{max-height:200px;overflow:auto;margin-top:4px}.tvs table{font-size:11px}
    .hb{display:flex;flex-direction:column;gap:6px}.hr{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:2px 8px;align-items:center;font-size:12px}.hl{color:var(--ink)}
    .ht{display:block;background:#f3edf6;border-radius:4px;height:12px;overflow:hidden}.ht i{display:block;height:100%;border-radius:4px}.hr small{grid-column:2/-1;color:var(--soft);font-size:11px;margin-top:-2px}
    .hm{overflow-x:auto}.hm table{font-size:11px;text-align:center;border-collapse:separate;border-spacing:2px}.hm th{font-weight:600;padding:2px 4px;white-space:nowrap;text-align:right;border:0}.hm td{min-width:22px;padding:3px 2px;border:0;border-radius:3px}.hm td.na{color:#c9bccf}
    .al{display:flex;flex-direction:column;gap:6px}.al>div{border:1px solid var(--edge);border-left-width:4px;border-radius:8px;padding:8px 10px;background:#fff}.al .bad{border-left-color:#d03b3b}.al .warn{border-left-color:#fab219}.al.ok>div{border-left-color:#0ca30c}
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .fl{display:flex;gap:12px;align-items:center;justify-content:space-between}.fl p{margin:4px 0 0}
    #tip{position:fixed;z-index:20;pointer-events:none;background:#2d2230;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
    @media (max-width:560px){main{padding:10px}header{padding:8px 10px}.cg{grid-template-columns:minmax(0,1fr)}.kg{grid-template-columns:repeat(2,minmax(0,1fr))}.fl{flex-direction:column;align-items:stretch}}
    .site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 16px;margin-bottom:8px}.site-grid .small{display:block;margin-top:2px}
    .thread{display:flex;flex-direction:column;gap:8px;margin:10px 0}.tmsg{align-self:flex-start;max-width:min(640px,90%);background:#f7f2f8;border:1px solid var(--edge);border-radius:12px;padding:8px 12px}
    .tmsg.team{align-self:flex-end;background:#eaf4ff}.tmsg p{margin:4px 0 0;overflow-wrap:anywhere}tr.new td{background:#fff8e1}
  </style>
</head>
<body><div id="root"></div><script type="module" src="./src/main.ts"></script></body>
</html>
