name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test          # luật chơi + toàn bộ RPC/migration trên Postgres thật (PGlite)
      - run: npm run build     # typecheck + build

  fit-check:
    name: Trình duyệt (kiểm tra khói + đồ mặc không lẹm)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs        # vuốt ve, cho ăn, trò chuyện, nhật ký, lớn lên, tắm, chơi, ngủ, cửa hàng
      - run: node scripts/fit-check.mjs    # 3.900 tổ hợp loài × dáng × đồ mặc, phải 0 lẹm
      - run: node scripts/mobile-check.mjs # giả lập iPhone: chạm, kéo thú, trồng rau, trang trí phòng, thanh trên không tràn, bản đồ và địa điểm
      - run: node scripts/social-check.mjs # bạn bè, hộp thư, quà, tin tức, thăm nhà (bạn ảo), 390px không tràn
      - run: node scripts/world-check.mjs  # sự kiện (biểu ngữ, nhân xu), không gian theo Gắn bó (ban công, phòng chơi, sân thượng)
      - run: node scripts/admin-smoke.mjs  # trang quản trị: vai trò, quà, thông báo, sự kiện, kiểm duyệt, nhật ký
